name: Build Donut Alerts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get mod files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unzip mod source
        run: unzip -o donut-alerts-source.zip -d buildsrc

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the mod
        working-directory: buildsrc/donut-alerts
        run: gradle build --stacktrace

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: donut-alerts-jar
          path: buildsrc/donut-alerts/build/libs/*.jar
          if-no-files-found: error
